---
layout: base.html
---

<div class="back-link">
  <a href="{{ '/blog-list/' | url }}">&larr; Back to Blog</a>
</div>

<article class="blog-post">
  <header class="blog-post-header">
    <h1>{{ title }}</h1>
    {%- if date -%}
      <div class="blog-post-meta">
        <time datetime="{{ date }}">{{ date | date: "%B %d, %Y" }}</time>
      </div>
    {%- endif -%}
  </header>

  {%- if summary -%}
    <details class="blog-summary">
      <summary class="blog-summary-toggle">
        <span class="summary-caret">▶</span>
        <span class="summary-label">summary</span>
      </summary>
      <div class="blog-summary-content">
        {{ summary }}
      </div>
    </details>
  {%- endif -%}

  <div class="blog-post-content">
    {{ content }}
  </div>
</article>
