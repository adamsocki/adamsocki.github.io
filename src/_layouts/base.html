<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "My Blog" }}</title>
  <link rel="stylesheet" href="{{ '/css/style.css' | url }}">
</head>
<body>
  <div id="banner">
    <h1><a href="{{ '/' | url }}">building in public</a></h1>
    <p class="description">ongoing projects and updates</p>
  </div>

  <div id="container">
    <div id="content">
      {{ content }}
    </div>

    <div id="sidebar">
      <div class="sidetitle">Navigation</div>
      <div class="side">
        <a href="{{ '/' | url }}">Home</a><br />
        <a href="{{ '/blog-list/' | url }}">Blog</a><br />
        <a href="{{ '/projects-list/' | url }}">Projects</a>
      </div>

      <div class="sidetitle">Archives</div>
      <div class="side">
        {%- for post in collections.post | reverse -%}
          <a href="{{ post.url }}">{{ post.data.title }}</a> <small>({{ post.date | date: "%b %d" }})</small><br />
        {%- endfor -%}
      </div>

      <div class="sidetitle">Meta</div>
      <div class="side">
        <p>Building in public &copy; {{ "now" | date: "%Y" }}</p>
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <span id="theme-label">theme: system</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Theme toggle functionality
    (function() {
      const themeToggle = document.getElementById('theme-toggle');
      const themeLabel = document.getElementById('theme-label');
      const html = document.documentElement;

      // Theme cycle: system -> light -> dark -> system
      const themes = ['system', 'light', 'dark'];

      // Get stored theme or default to system
      let currentTheme = localStorage.getItem('theme') || 'system';

      function applyTheme(theme) {
        if (theme === 'system') {
          html.removeAttribute('data-theme');
          // Apply system preference
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            html.setAttribute('data-theme', 'dark');
          }
        } else {
          html.setAttribute('data-theme', theme);
        }
        themeLabel.textContent = 'theme: ' + theme;
        localStorage.setItem('theme', theme);
      }

      // Apply initial theme
      applyTheme(currentTheme);

      // Listen for system theme changes
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
          if (currentTheme === 'system') {
            applyTheme('system');
          }
        });
      }

      // Toggle button click handler
      themeToggle.addEventListener('click', () => {
        const currentIndex = themes.indexOf(currentTheme);
        const nextIndex = (currentIndex + 1) % themes.length;
        currentTheme = themes[nextIndex];
        applyTheme(currentTheme);
      });
    })();
  </script>
</body>
</html>
