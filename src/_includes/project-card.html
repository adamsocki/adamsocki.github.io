<div class="project-card">
  <h3 class="project-title">{{ title }}</h3>

  <p class="project-description">{{ description }}</p>

  <div class="project-meta">
    <div class="project-tags">
      {%- for tag in tags -%}
        <span class="tag">{{ tag }}</span>
      {%- endfor -%}
    </div>

    <div class="project-status">
      <span class="status-badge status-{{ status | downcase | replace: " ", "-" }}">{{ status }}</span>
    </div>
  </div>

  <div class="project-links">
    {%- if repoUrl -%}
      <a href="{{ repoUrl }}" class="project-link">GitHub</a>
    {%- endif -%}

    {%- if demoUrl -%}
      <a href="{{ demoUrl }}" class="project-link">Live Demo</a>
    {%- endif -%}

    {%- if blogPost -%}
      <a href="{{ blogPost }}" class="project-link">Read More</a>
    {%- endif -%}
  </div>
</div>
